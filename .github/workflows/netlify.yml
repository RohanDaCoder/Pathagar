name: Deploy Web (Netlify)

# Deploys the built web app (dist/) to Netlify on every push to main, using the
# official netlify/actions CLI action. Netlify is the PRIMARY web home: its
# /pdf/* reverse proxy (public/_redirects) is what makes PDF downloads work in
# browsers — the PDF host sends no CORS headers.
#
# Until the orchestrator sets the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repo
# secrets, the deploy job shows as SKIPPED (gray), not green — that is
# deliberate: this workflow must never look successful without having deployed.
# (README → "Web deploy" explains how to set the secrets.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-check:
    name: Netlify secrets present?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check secrets
        id: check
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Netlify deploy SKIPPED — the NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are not set (Settings → Secrets and variables → Actions). The Deploy job below will show as 'skipped'."
          fi

  deploy:
    name: Deploy dist → Netlify
    needs: secrets-check
    if: needs.secrets-check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # bun 1.4.6 line (built-in linter) — canaries are npm-only, see ci.yml
      - run: npm install -g bun@1.4.5-canary.20261119.1
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Deploy to Netlify (official action)
        uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426 # master (pinned)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        with:
          args: deploy --dir=dist --prod
