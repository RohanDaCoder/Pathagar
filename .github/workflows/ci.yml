name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: checkout only. Nothing in this workflow needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (bun check · fmt · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # bun 1.4.6 line (built-in linter). Canary builds are npm-only — there is
      # no GitHub release for setup-bun to fetch — so install the exact version
      # via npm. Flip back to oven-sh/setup-bun once 1.4.6 is on npm stable.
      - run: npm install -g bun@1.4.5-canary.20261119.1
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun check # native typecheck (same errors as tsc, all cores)
      - run: bun fmt --check
      - run: bun lint # built-in linter, strict profile in bunfig.toml
      - run: bun test
      - run: bun run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathagar-web
          path: dist
          if-no-files-found: error
