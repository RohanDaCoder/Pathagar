name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (bun check · fmt · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5 # cache: enabled by default, keyed on bun.lock

      - run: bun install --frozen-lockfile
      - run: bun check # native typecheck (same errors as tsc, all cores)
      - run: bun fmt --check
      - run: bun run lint # biome (bun has no built-in lint command)
      - run: bun test
      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: pathagar-web
          path: dist
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # legacy 'tools' package was removed from the SDK repo

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle*', 'android/app/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run cap:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Pathagar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
