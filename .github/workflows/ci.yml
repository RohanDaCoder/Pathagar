name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check all JS modules
        run: |
          fail=0
          for f in $(find www/js -name '*.js') www/sw.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: sw.js precache covers every module
        run: |
          missing=0
          for f in $(cd www && find js -name '*.js'); do
            grep -q "$f" www/sw.js || { echo "::error::MISSING from sw.js precache: $f"; missing=1; }
          done
          exit $missing

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Pathagar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
