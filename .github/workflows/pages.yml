name: Deploy Web (GitHub Pages)

# Deploys the built web app to GitHub Pages on every push to main.
# The app is hash-routed, so the /Pathagar/ subpath works; vite is built with
# VITE_BASE=/Pathagar/ so assets, the manifest and the service worker all
# resolve under that prefix.
#
# NOTE: this is a DEMO mirror. GitHub Pages cannot reverse-proxy /pdf/* to the
# guide PDF host (which sends no CORS headers), so chapter DOWNLOADS don't work
# here — the app shows a banner explaining this. Full functionality lives on
# the Netlify deployment and in the Android APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the Pages jobs elevate what deploy-pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # provision the Pages site
      id-token: write # deployment token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # bun 1.4.6 line (built-in linter) — canaries are npm-only, see ci.yml
      - run: npm install -g bun@1.4.5-canary.20261119.1
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_BASE: /Pathagar/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # deploy to the Pages site
      id-token: write # deployment token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
