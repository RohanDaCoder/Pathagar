name: Release

# Tag-based releases: push a tag `vX.Y.Z` -> signed APK on GitHub Releases.
# versionCode = major*10000 + minor*100 + patch (set on the release APK).
# The in-app updater reads the "latest" release of this repo.
# (The web bundle is deployed by the Netlify and Pages workflows on main —
# a zipped copy is no longer attached here.)
on:
  push:
    tags: ["v*"]

# Least privilege by default; only the release job writes (gh release create).
permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # bun 1.4.6 line (built-in linter) — canaries are npm-only, see ci.yml
      - run: npm install -g bun@1.4.5-canary.20261119.1
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 targets Java 21 bytecode
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools # legacy 'tools' package was removed from the SDK repo

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle*', 'android/app/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run cap:sync

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MA MI PA <<< "$TAG"
          VCODE=$((MA*10000 + MI*100 + PA))
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VCODE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Stage APK with release name
        run: cp android/app/build/outputs/apk/release/app-release.apk "Pathagar-v${VERSION_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pathagar v${VERSION_NAME}" \
            --generate-notes \
            "Pathagar-v${VERSION_NAME}.apk"
