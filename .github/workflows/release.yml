name: Release

# Tag-based releases: push a tag `vX.Y.Z` -> signed APK + web bundle on GitHub Releases.
# versionCode = major*10000 + minor*100 + patch (set on the release APK).
# The in-app updater reads the "latest" release of this repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5 # cache: enabled by default, keyed on bun.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # legacy 'tools' package was removed from the SDK repo

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle*', 'android/app/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run cap:sync

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MA MI PA <<< "$TAG"
          VCODE=$((MA*10000 + MI*100 + PA))
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VCODE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Stage APK with release name
        run: cp android/app/build/outputs/apk/release/app-release.apk "Pathagar-v${VERSION_NAME}.apk"

      - name: Package web bundle
        run: cd dist && zip -rq "../pathagar-web-v${VERSION_NAME}.zip" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pathagar v${VERSION_NAME}" \
            --generate-notes \
            "Pathagar-v${VERSION_NAME}.apk" \
            "pathagar-web-v${VERSION_NAME}.zip"
