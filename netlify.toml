# Pathagar — Netlify configuration
# The web app is the vite build output (dist/); Capacitor wraps the same bundle
# into the Android app. Deploy with the CLI action (.github/workflows/netlify.yml)
# or drag a local `bun run build` output here: https://app.netlify.com/drop

[build]
# self-gating: the same checks CI runs gate every Netlify build (production
# AND deploy previews) — a red check/test can never ship a deploy.
# Netlify's image ships an older bun (no `bun check`), so pin the same
# canary CI installs first.
command = "npm install -g bun@1.4.5-canary.20261119.1 && bun install --frozen-lockfile && bun check && bun test && bun run build"
publish = "dist"

# PDF reverse proxy.
# The guide-book PDF host (pdf.tetashweb.xyz) does NOT send CORS headers, so the
# browser cannot fetch PDF bytes directly from it. This redirect makes the PDFs
# same-origin under your Netlify domain: /pdf/<path> -> https://pdf.tetashweb.xyz/<path>
# The API host (books.tetashweb.xyz) already sends Access-Control-Allow-Origin: *,
# so it is called directly and needs no proxy.
[[redirects]]
from = "/pdf/*"
to = "https://pdf.tetashweb.xyz/:splat"
status = 200
force = true

# PWA: never cache the manifest itself, and SPA fallback to index.html
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Cache-Control = "no-cache"
